name: Simple CI-CD Pipeline

# Trigger the pipeline on every push to the main branch
on:
  push:
    branches: [ main ]

jobs:
  # Job 1: Continuous Integration (Test the code)
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

  # Job 2: Continuous Delivery (Simulate a build/deployment step)
  continuous-delivery:
    needs: continuous-integration # Only runs if the integration/test job passes successfully
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate Deployment
        run: echo "Deploying application to production server..."